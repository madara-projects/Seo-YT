apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: signoz
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.signoz.io
    chart: signoz
    targetRevision: 0.55.0
    helm:
      releaseName: signoz
      values: |
        clickhouse:
          persistence:
            size: 10Gi
        otelCollector:
          replicaCount: 1
        frontend:
          service:
            type: ClusterIP
        # Bitnami removed pinned legacy tags from docker.io/bitnami/* in
        # Aug-2025; the free mirror lives at docker.io/bitnamilegacy/*.
        zookeeper:
          image:
            registry: docker.io
            repository: bitnamilegacy/zookeeper
            tag: 3.7.1
  destination:
    server: https://kubernetes.default.svc
    namespace: signoz
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
