apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: signoz
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.signoz.io
    chart: signoz
    targetRevision: 0.117.1
    helm:
      releaseName: signoz
      values: |
        # SigNoz chart 0.55.0 was retired from the chart index; 0.117.x is
        # current stable. Newer versions don't depend on the deprecated
        # Bitnami images so no overrides are needed.
        clickhouse:
          persistence:
            size: 10Gi
        otelCollector:
          replicaCount: 1
        frontend:
          service:
            type: ClusterIP
  destination:
    server: https://kubernetes.default.svc
    namespace: signoz
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
