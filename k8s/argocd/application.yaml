apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: seo-app
  namespace: argocd
  finalizers:
    # Ensures the app's resources are removed if the Application is deleted.
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/madara-projects/Seo-YT.git
    targetRevision: main
    path: k8s
    # ArgoCD auto-detects the kustomization.yaml in this path.

  destination:
    server: https://kubernetes.default.svc
    namespace: seo-app

  syncPolicy:
    automated:
      prune: true       # remove resources that are deleted from git
      selfHeal: true    # revert manual edits in the cluster back to git state
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m

  revisionHistoryLimit: 10
