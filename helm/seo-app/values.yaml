image:
  repository: seo-app
  tag: "ollama"          # CI bumps this line
  pullPolicy: Never      # local Minikube image

replicaCount: 3

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

env:
  PORT: "8000"
  OLLAMA_BASE_URL: "http://host.docker.internal:11434"
  OLLAMA_MODEL: "mistral"
  WIN_ENGINE_DATABASE_PATH: "/app/win_engine.db"

resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

probes:
  startup:
    path: /health
    initialDelaySeconds: 2
    periodSeconds: 3
    failureThreshold: 10
  readiness:
    path: /ready
    periodSeconds: 10
    failureThreshold: 3
  liveness:
    path: /health
    periodSeconds: 20
    failureThreshold: 3

ingress:
  enabled: false        # APISIX route is preferred — flip on for vanilla nginx-ingress
  className: nginx
  host: seo.local
  path: /

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  cpuTargetPercent: 70

apisix:
  enabled: true
  host: seo.local

# Vault sidecar injection — flip on after Vault bootstrap (see docs)
vault:
  enabled: false
  role: seo-app
  secretPath: secret/data/seo-app
