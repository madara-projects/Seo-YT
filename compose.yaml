services:
  win-engine:
    build: .
    container_name: youtube-win-engine
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      - WIN_ENGINE_REDIS_URL=redis://redis:6379/0
      - WIN_ENGINE_BIND_HOST=0.0.0.0
    depends_on:
      - redis
    volumes:
      - ./win_engine.db:/app/win_engine.db
      - ./backups:/app/backups
      - ./secrets/aiven-ca.pem:/run/secrets/aiven-ca.pem:ro
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    container_name: youtube-win-engine-redis
    restart: unless-stopped
