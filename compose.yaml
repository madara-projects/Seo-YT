services:
  win-engine:
    build: .
    container_name: youtube-win-engine
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      - WIN_ENGINE_REDIS_URL=redis://redis:6379/0
      - WIN_ENGINE_BIND_HOST=0.0.0.0
      - WIN_ENGINE_DATABASE_PATH=runtime/data/win_engine.db
    depends_on:
      - redis
    volumes:
      - ./runtime/data:/app/runtime/data
      - ./runtime/secrets/aiven-ca.pem:/run/secrets/aiven-ca.pem:ro
    # The app writes only to runtime/data (mounted above) and /tmp.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Ceilings, so a runaway request or leak slows this app instead of the machine.
    mem_limit: 1g
    cpus: 2
    pids_limit: 256
    # The snapshot collector waits up to 15 s for a YouTube call in progress.
    stop_grace_period: 30s
    restart: unless-stopped
  redis:
    image: redis:7.4.11-alpine
    container_name: youtube-win-engine-redis
    # Only a research cache: least-recently-used entries make room, so a full
    # cache evicts instead of failing writes or reaching the memory ceiling.
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    # Not published to the host; only win-engine reaches it on this network.
    # As the image's own redis user it needs no capabilities, and it writes
    # only to its /data volume.
    user: redis
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 64
    restart: unless-stopped
